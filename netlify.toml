// netlify/functions/gemini.js
exports.handler = async (event) => {
  if (event.httpMethod !== 'POST') {
    return { statusCode: 405, body: 'Method Not Allowed' };
  }

  const API_KEY = process.env.GEMINI_API_KEY;
  if (!AIzaSyCITxZ2xvZ401SWPJDHAjT9Iza0hAbtCP0) {
    return { statusCode: 500, body: JSON.stringify({ error: 'API key not configured' }) };
  }

  const { contents, generationConfig } = JSON.parse(event.body);
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`;

  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents,
        generationConfig: generationConfig || { temperature: 0.1, maxOutputTokens: 800 },
      }),
    });
    const data = await response.json();
    return {
      statusCode: 200,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    };
  } catch (error) {
    return { statusCode: 502, body: JSON.stringify({ error: error.message }) };
  }
};
